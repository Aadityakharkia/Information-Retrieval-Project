[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-medical-rag"
version = "0.1.0"
description = "Trustworthy Medical RAG on MedQuAD with Inspectable IR Components and Citation Verification"
authors = [{ name = "CSD358 IR Hackathon Team" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "groq>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "tqdm>=4.65.0",
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
