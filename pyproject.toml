[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag"
version = "1.0.0"
description = "Trustworthy Medical RAG on MedQuAD with inspectable IR components and citation verification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "groq>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
medrag-cli = "scripts.cli:run_cli"

[tool.setuptools.packages.find]
include = ["medrag*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
