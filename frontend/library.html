<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — HealthNest</title>
  <meta name="description" content="Browse verified medical Q&A corpus indexed with inverted index and dense embeddings.">
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo-block">
        <span class="logo-main">HEALTHNEST</span>
        <span class="logo-sub">verifiable health rag</span>
      </a>

      <nav class="header-nav-links">
        <a href="/">Home</a>
        <a href="/library" class="active">Library</a>
        <a href="/about">About</a>
      </nav>

      <a href="/" class="btn-pill btn-outline">Ask Question</a>
    </div>
  </header>

  <main class="container" style="padding-top: 1.5rem; padding-bottom: 5rem;">
    <!-- Hero Title -->
    <div style="margin-bottom: 2.5rem;">
      <h1 class="text-massive" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Health Q&A Library</h1>
      <p class="text-subtitle">
        Explore 1,000+ indexed clinical documents from Kaggle MedQuAD.
      </p>
    </div>

    <!-- Filter Controls -->
    <div class="library-search-container">
      <input type="text" id="libSearchInput" class="library-search-input" placeholder="Search keywords in library corpus (e.g. fever, diabetes, dosage)...">
      <button id="btnLibSearch" class="btn-pill btn-white" style="padding: 0 2rem;">Search</button>
    </div>

    <!-- Layout Container -->
    <div style="display: flex; gap: 2rem; align-items: flex-start; margin-top: 2rem;">
      <!-- Sidebar for Topics -->
      <aside style="flex: 0 0 250px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem;">
        <h3 style="margin-top: 0; margin-bottom: 1rem; font-size: 1.2rem;">Topics</h3>
        <ul id="topicList" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem;">
          <!-- Topics will be loaded here -->
        </ul>
      </aside>

      <!-- Main Content -->
      <div style="flex: 1;">
        <!-- Chunks Grid -->
        <div id="libraryGrid" class="library-grid" style="grid-template-columns: 1fr;"></div>

        <!-- Pagination -->
        <div class="pagination-bar">
          <button id="btnPrevPage" class="btn-pill btn-outline" style="padding: 0.6rem 1.4rem;">Previous</button>
          <span id="pageIndicator" class="page-indicator">Page 1</span>
          <button id="btnNextPage" class="btn-pill btn-outline" style="padding: 0.6rem 1.4rem;">Next</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>HealthNest • Verifiable Medical RAG Engine • NIH MedQuAD Dataset • Built with Porter Stemmer, SMART lnc.ltc, BM25, Dense & RRF</p>
  </footer>

  <script type="module" src="js/library.js"></script>
</body>
</html>
